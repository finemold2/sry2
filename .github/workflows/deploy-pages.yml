# GitHub Pages 배포: main 푸시마다 앱을 빌드해 소개 페이지(site/) + 앱(/app/) 구성으로 게시.
#   https://finemold2.github.io/sry2/      → 소개(랜딩) 페이지
#   https://finemold2.github.io/sry2/app/  → 실제 앱 (PWA)
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 함(configure-pages 가 최초 1회 자동 설정 시도).
name: Deploy to GitHub Pages

on:
  push:
    # 배포는 main 푸시에서만: github-pages 환경의 보호 규칙이 main 외 브랜치의 배포를 거부한다(design-v2 트리거는 deploy 잡에서 실패).
    # 브랜치 미리보기(/v2/)는 main 배포 때 design-v2 를 함께 빌드해 갱신된다. 환경 설정(Settings → Environments → github-pages →
    # Deployment branches)에 design-v2 를 허용하면 여기 branches 에 design-v2 를 추가해 브랜치 푸시마다 갱신할 수 있다.
    branches: [main]
    # 사이트에 포함되지 않는 문서만 바뀐 커밋은 재배포하지 않음
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'site/README.md'
      - 'site/DESIGN.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 어느 브랜치가 트리거했든 본 사이트(랜딩 + /app/)는 main 기준

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 검증 루틴(CLAUDE.md): tsc 0 → 단위 테스트 → 빌드. 하나라도 실패하면 배포하지 않음.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build:pages
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
