# GitHub Pages 배포: main 푸시마다 앱을 빌드해 소개 페이지(site/) + 앱(/app/) 구성으로 게시.
#   https://finemold2.github.io/sry2/      → 소개(랜딩) 페이지
#   https://finemold2.github.io/sry2/app/  → 실제 앱 (PWA)
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 함(configure-pages 가 최초 1회 자동 설정 시도).
name: Deploy to GitHub Pages

on:
  push:
    # design-v2 푸시도 배포를 돌린다: 사이트 본체는 항상 main 을 체크아웃해 빌드하고, 브랜치 빌드는 /v2/ 에만 들어간다
    branches: [main, design-v2]
    # 사이트에 포함되지 않는 문서만 바뀐 커밋은 재배포하지 않음
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'site/README.md'
      - 'site/DESIGN.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 어느 브랜치가 트리거했든 본 사이트(랜딩 + /app/)는 main 기준

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 검증 루틴(CLAUDE.md): tsc 0 → 단위 테스트 → 빌드. 하나라도 실패하면 배포하지 않음.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build:pages
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
